<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="c1" cx="35%" cy="35%" r="60%">
      <stop offset="0" stop-color="#FFE57F"/>
      <stop offset="1" stop-color="#F9A825"/>
    </radialGradient>
    <radialGradient id="c2" cx="35%" cy="35%" r="60%">
      <stop offset="0" stop-color="#FFD740"/>
      <stop offset="1" stop-color="#E65100"/>
    </radialGradient>
    <radialGradient id="c3" cx="35%" cy="35%" r="60%">
      <stop offset="0" stop-color="#FFECB3"/>
      <stop offset="1" stop-color="#FFB300"/>
    </radialGradient>
  </defs>
  <!-- Coin 1: back-left, tilted -->
  <g transform="rotate(-22, 17, 23)">
    <circle cx="17" cy="23" r="11" fill="url(#c3)" stroke="#B8860B" stroke-width="1.2"/>
    <circle cx="17" cy="23" r="7.5" fill="none" stroke="#B8860B" stroke-width="0.7" opacity="0.55"/>
    <circle cx="17" cy="23" r="2" fill="#B8860B" opacity="0.45"/>
  </g>
  <!-- Coin 2: back-right, tilted -->
  <g transform="rotate(18, 32, 20)">
    <circle cx="32" cy="20" r="10" fill="url(#c2)" stroke="#B8860B" stroke-width="1.2"/>
    <circle cx="32" cy="20" r="6.8" fill="none" stroke="#B8860B" stroke-width="0.7" opacity="0.55"/>
    <circle cx="32" cy="20" r="1.8" fill="#B8860B" opacity="0.45"/>
  </g>
  <!-- Coin 3: front-center, slight tilt -->
  <g transform="rotate(-6, 23, 31)">
    <circle cx="23" cy="31" r="12" fill="url(#c1)" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="23" cy="31" r="8.5" fill="none" stroke="#B8860B" stroke-width="0.8" opacity="0.55"/>
    <circle cx="23" cy="31" r="2.2" fill="#B8860B" opacity="0.45"/>
  </g>
</svg>
