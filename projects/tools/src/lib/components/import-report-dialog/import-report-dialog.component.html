<div class="dialog-container">
  <div class="dialog-title">Raport importu płatności</div>

  <table mat-table
         [dataSource]="dataSource"
         class="report-table">

    <ng-container matColumnDef="row">
      <th mat-header-cell
          *matHeaderCellDef>#</th>
      <td mat-cell
          *matCellDef="let element">{{ element.row }}</td>
    </ng-container>

    <ng-container matColumnDef="id">
      <th mat-header-cell
          *matHeaderCellDef>ID</th>
      <td mat-cell
          *matCellDef="let element">{{ element.id }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell
          *matHeaderCellDef>Status</th>
      <td mat-cell
          *matCellDef="let element"
          [class.status-error]="element.error"
          [class.status-ok]="!element.error">
        {{ element.status }}
      </td>
    </ng-container>

    <ng-container matColumnDef="error">
      <th mat-header-cell
          *matHeaderCellDef>Komunikat</th>
      <td mat-cell
          *matCellDef="let element">{{ element.error }}</td>
    </ng-container>

    <tr mat-header-row
        *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row
        *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div class="buttons-panel">
    <button mat-raised-button
            color="primary"
            (click)="close()">Zamknij</button>
  </div>
</div>
