<app-table #table
           pullToRefresh
           (pullToRefresh)="refresh()"
           [tableTitle]="'Rachunki (' + filtered().length + ')'"
           [data]="filtered()"
           [columnsDefinition]="columns"
           [editable]="true"
           [canAdd]="true"
           [showPasteButton]="false"
           [showRefreshButton]="false"
           [pageable]="false"
           [expandable]="false"
           [showFilter]="true"
           [sortable]="true"
           [rowStyle]="inactiveRowStyle"
           [extraMenuItems]="menuItems()"
           (rowActivated)="onRowClicked($event)"
           (deleteButtonClicked)="deleteBill()"
           (editButtonClicked)="editBill()"
           (addButtonClicked)="addBill()"
           (refreshButtonClicked)="refresh()"
           (rowDblClick)="editBill()">
  <ng-template cellTemplateForColumn="name"
               let-row="row">
    <a [routerLink]="['/rachunek', row.id]"
       routerLinkActive="active"
       [style.color]="row.active ? null : 'grey'">{{ row.name }}</a>
  </ng-template>

  <ng-template cellTemplateForColumn="dueDate"
               let-row="row">
    <span [billDueColor]="row.dueDate"
          [active]="row.active">
      {{ row.dueDate | timespanToString }}
    </span>
  </ng-template>

  <ng-template cellTemplateForColumn="sum"
               let-row="row">
    <span>{{ row.sum | currencyToString }}</span>
  </ng-template>

  <ng-template #footerTemplate>
    <div class="table-footer-summary">
      <span class="footer-segment">
        <span class="footer-label">Nadchodzące:</span>
        <span class="footer-value footer-urgent">{{ urgentSum() | currencyToString }}</span>
      </span>
      <span class="footer-segment">
        <span class="footer-label">Pozostałe:</span>
        <span class="footer-value">{{ remainingSum() | currencyToString }}</span>
      </span>
      <span class="footer-segment footer-total">
        <span class="footer-label">Łącznie:</span>
        <span class="footer-value">{{ totalSum() | currencyToString }}</span>
      </span>
    </div>
  </ng-template>

  <ng-template #rightToolbarPanelTemplate>
    <button mat-icon-button
            class="only-large-screen"
            matTooltip="Odśwież"
            (click)="refresh()">
      <span class="material-icons"
            inline="true">refresh</span>
    </button>
    <button mat-icon-button
            class="only-large-screen"
            [color]="filterInactive() ? 'primary' : ''"
            [matTooltip]="filterInactive() ? 'Pokaż nieaktywne' : 'Ukryj nieaktywne'"
            (click)="toggleInactiveFilter()">
      <span class="material-icons"
            inline="true">filter_alt</span>
    </button>
    <button mat-icon-button
            class="only-large-screen"
            matTooltip="Raporty"
            routerLink="/raporty">
      <span class="material-icons"
            inline="true">bar_chart</span>
    </button>
    @if (pushNotifications.isSupported) {
    <button mat-icon-button
            class="only-large-screen"
            [matTooltip]="pushNotifications.isSubscribed() ? 'Wyłącz powiadomienia' : 'Włącz powiadomienia'"
            (click)="pushNotifications.isSubscribed() ? pushNotifications.unsubscribe() : pushNotifications.subscribe()">
      <span class="material-icons"
            inline="true">{{ pushNotifications.isSubscribed() ? 'notifications_off' : 'notifications' }}</span>
    </button>
    }
    <button mat-icon-button
            class="only-large-screen"
            [matTooltip]="themeService.darkMode() ? 'Tryb jasny' : 'Tryb ciemny'"
            (click)="themeService.toggle()">
      <span class="material-icons"
            inline="true">{{ themeService.darkMode() ? 'light_mode' : 'dark_mode' }}</span>
    </button>
    <button mat-icon-button
            class="only-large-screen"
            matTooltip="Wyloguj"
            (click)="logout()">
      <span class="material-icons"
            inline="true">power_settings_new</span>
    </button>
    <button mat-icon-button
            class="only-large-screen"
            matTooltip="Zapłacony"
            (click)="payBill()">
      <span class="material-icons"
            inline="true">check</span>
    </button>
  </ng-template>
</app-table>
